# ==================================================================
# config/explainability.yaml - explainability (XAI), error analysis and moderation design (Task 15)
# ==================================================================
# Kept separate from config.yaml because config.yaml is checksum-frozen by the Task 13 final
# evaluation (results/final/model_freeze_manifest.json), exactly like config/ocr.yaml in Task 14.
# Everything below was written BEFORE any explanation was computed on TEST.
# Explanations are MODEL ATTRIBUTION, not proof of reasoning or causality.
# No credentials and no user data here. See docs/EXPLAINABILITY_ERROR_ANALYSIS_REPORT.md.
# ==================================================================

version: "1.0"

models:                                   # the frozen Task 13 finals (verify_freeze() before every TEST step)
  text: "T05"                             # fine-tuned MuRIL, HINGLISH_NORMALIZED
  image: "I03"                            # frozen SigLIP + logistic regression
  multimodal: "M04"                       # fusion MLP over T05 pooled [CLS] + SigLIP pooled embedding
  traditional_text: "B07"                 # TF-IDF + LR (exact linear contributions; fast UI alternative)

# All attributions are in LOG-ODDS units of the class "misogynistic" (logit difference); positive values
# push towards "misogynistic", negative towards "non-misogynistic". Probabilities saturate, log-odds do not.
text:
  method: "integrated_gradients"          # fine-tuned transformer (T05)
  steps: 32                               # midpoint Riemann sum; completeness error is reported per explanation
  baseline: "pad_embedding"               # every non-special token's embedding replaced by the [PAD] embedding
  aggregation: "sum of WordPiece attributions per whitespace word"
  linear_method: "coefficient_times_tfidf" # TF-IDF + LR/SVM: exact decomposition of the decision function
  top_k: 5
explain_all_test_texts: true              # T05 IG + B07 linear for all 758 TEST captions (research cache)

image:
  method: "occlusion"                     # model-agnostic; Grad-CAM does not apply (SigLIP is a ViT, not a CNN)
  window: 56                              # pixels in the 224 x 224 model input (= 3.5 x 3.5 ViT patches)
  stride: 28                              # 7 x 7 = 49 occluded copies; map resolution 8 x 8 cells
  fill: 0.0                               # 0 in SigLIP-normalised space = mid-grey (pixel value 0.5)
  ui_window: 112                          # lightweight real-time variant: 3 x 3 = 9 occluded copies
  ui_stride: 56
  research_set:                           # images explained for the statistics (TEST)
    uniform_random: 200                   # uniform random TEST memes (seed below): unbiased overall statistics
    add_all_errors_of: ["M04", "I03"]     # every TEST error of these models is added
    seed: 42
  sanity_check_random_classifiers: 5      # model-randomisation check: classifier weights replaced by random ones

multimodal:
  method: "modality_ablation_and_unimodal_comparison"
  ablation_baseline: "train_mean"         # a modality's features replaced by their TRAIN mean (= 0 after the
                                          # fusion model's own standardisation); same definition as Task 13
  agreement_rule: "count of single-modality models (T05, I03) whose label differs from M04: 0 AGREE, 1 PARTIAL DISAGREEMENT, 2 DISAGREE"
  text_attribution_through_fusion: true   # IG through T05 encoder -> M04 (image features held fixed)
  image_attribution_through_fusion: true  # occlusion through SigLIP -> M04 (text features held fixed)

explanation_sample_set:                   # 15.10: representative TEST examples (deterministic)
  per_category: 3
  seed: 42
  categories:                             # in this order; a meme is used at most once
    - "true_positive"                     # M04 = 1, label 1
    - "true_negative"                     # M04 = 0, label 0
    - "false_positive"                    # M04 = 1, label 0
    - "false_negative"                    # M04 = 0, label 1
    - "text_image_disagreement"           # T05 != I03
    - "multimodal_correction"             # I03 wrong, M04 right
    - "multimodal_failure"                # M04 wrong while T05 or I03 is right
    - "ocr_failure"                       # Task 14: M04 or T05 label changes with OCR text
    - "hinglish_example"                  # caption matches a Task 6 Hinglish-variant rule
    - "negation_example"                  # caption contains a Task 6 negation word

lexicons:                                 # declared before analysis; used only to GROUP attributions
  female_reference: ["girl", "girls", "woman", "women", "lady", "ladies", "wife", "gf", "girlfriend", "she", "her",
                     "mom", "mother", "sister", "daughter", "aunty", "aunt", "bride",
                     "ladki", "ladkiya", "ladkiyan", "ladkiyon", "ladkiyo", "aurat", "aurate", "auraten", "auraton",
                     "biwi", "bibi", "patni", "bhabhi", "didi", "behen", "bahen", "maa", "mummy", "beti", "saas",
                     "bahu", "dulhan", "लड़की", "लड़कियां", "लड़कियों", "औरत", "औरतें", "औरतों", "बीवी", "पत्नी",
                     "भाभी", "दीदी", "बहन", "माँ", "बेटी", "सास", "बहू"]
  male_reference: ["boy", "boys", "man", "men", "husband", "bf", "boyfriend", "he", "him", "dad", "father",
                   "brother", "son", "uncle", "groom", "ladka", "ladke", "ladko", "aadmi", "mard", "pati", "bhai",
                   "bhaiya", "papa", "beta", "jiju", "लड़का", "लड़के", "आदमी", "मर्द", "पति", "भाई", "पापा", "बेटा"]
  watermark: ["doublemeaning", "doublemean"]
  # negation words and Hinglish variants come from the frozen Task 6 code (src/preprocessing/hinglish.py)

error_analysis:
  population: "TEST memes where T05, I03 or M04 is wrong, or where the M04/T05 label changes with OCR text (Task 14)"
  manual_review:
    additional_m04_errors: 36             # on top of the 24 reviewed in Task 13 -> 60 of 149 M04 errors
    stratify_by: "false_positive / false_negative"
    seed: 42
    reviewer: "single reviewer (AI assistant in this session); no inter-annotator agreement"

# 15.21 moderation recommendation design (future UI; NOT applied to any user yet).
# Deterministic, label- and agreement-based. NO confidence thresholds: the scores are uncalibrated.
# No automatic BLOCK exists. Wording: "model prediction", "potentially misogynistic", "flagged for review".
moderation:
  outputs: ["ALLOW", "WARNING", "HUMAN_REVIEW"]
  meme_mode:                              # rules are applied in this order; first match wins
    - {id: "M0", when: "ocr_route == reject", then: null, reason: "image could not be read; no analysis"}
    - {id: "M1", when: "ocr_route == image_only_and_human_review", then: "HUMAN_REVIEW", reason: "OCR text unreliable (very low OCR confidence)"}
    - {id: "M2", when: "ocr_route == image_only and image_label == 1", then: "HUMAN_REVIEW", reason: "only the image model was available and it flags the meme"}
    - {id: "M3", when: "ocr_route == image_only and image_label == 0", then: "ALLOW", reason: "image model does not flag the meme; text could not be analysed"}
    - {id: "M4", when: "text, image and multimodal labels all 1", then: "WARNING", reason: "all three models flag the meme as potentially misogynistic"}
    - {id: "M5", when: "text, image and multimodal labels all 0", then: "ALLOW", reason: "no model flags the meme"}
    - {id: "M6", when: "otherwise (models disagree)", then: "HUMAN_REVIEW", reason: "the models disagree"}
  text_mode:                              # Analyze Text: FINAL_TEXT_MODEL T05 with B07 as a second opinion
    - {id: "T0", when: "processed text empty", then: "HUMAN_REVIEW", reason: "no text to analyse (empty text is a known shortcut of the text models)"}
    - {id: "T1", when: "T05 and B07 labels both 1", then: "WARNING", reason: "both text models flag the text"}
    - {id: "T2", when: "T05 and B07 labels both 0", then: "ALLOW", reason: "no text model flags the text"}
    - {id: "T3", when: "otherwise (text models disagree)", then: "HUMAN_REVIEW", reason: "the text models disagree"}

cache:
  dir_env: "NLP_CLD_MODEL_DIR"            # research cache at <parent of $NLP_CLD_MODEL_DIR>/cache/xai (outside the repo)
  subdir: "cache/xai"
  key: "content sha256 (text or image) + model version + method + method parameters + config version"
  cache_user_uploads: false

outputs:
  tables: "results/tables/explainability"
  figures: "results/figures/explainability"
  metrics: "results/metrics/explainability"
  per_sample: "results/predictions/explainability"   # tokens / OCR text / overlays of dataset memes: git-ignored

ui_disclaimer: "Explanations show model attribution and may not reflect human reasoning. The model classifies content, not people."
